[project]
name = "fraudlab"
version = "1.1.0"
description = "Cost-sensitive credit-card fraud review lab for business analytics"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=fraudlab --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["fraudlab"]
branch = false

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
